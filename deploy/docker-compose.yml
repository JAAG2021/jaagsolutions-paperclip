# Requiere: deploy/.env (copiar desde .env.production.example)
# Levantar: cd deploy && docker compose --env-file .env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  paperclip:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3100"
      SERVE_UI: "true"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      PAPERCLIP_HOME: /paperclip
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL}
      PAPERCLIP_DEPLOYMENT_MODE: ${PAPERCLIP_DEPLOYMENT_MODE}
      PAPERCLIP_DEPLOYMENT_EXPOSURE: ${PAPERCLIP_DEPLOYMENT_EXPOSURE}
    volumes:
      - ${PAPERCLIP_DATA_DIR}:/paperclip
    networks:
      - internal
      - web
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:3100/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  n8n:
    image: n8nio/n8n:1.112.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      paperclip:
        condition: service_healthy
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: America/Bogota
      # Expuestas al workflow (Code / expresiones vía process.env)
      PAPERCLIP_URL: http://paperclip:3100
      PAPERCLIP_COMPANY_ID: ${PAPERCLIP_COMPANY_ID}
      PAPERCLIP_A3_AGENT_ID: ${PAPERCLIP_A3_AGENT_ID}
      PAPERCLIP_P2_PROJECT_ID: ${PAPERCLIP_P2_PROJECT_ID}
      PAPERCLIP_G2_GOAL_ID: ${PAPERCLIP_G2_GOAL_ID}
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY}
      FORMSPREE_WEBHOOK_SECRET: ${FORMSPREE_WEBHOOK_SECRET}
      FORMSPREE_FORM_HASHID: ${FORMSPREE_FORM_HASHID:-}
      # ── Content Pipeline ──────────────────────────────────
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_PAGE_ID: ${META_PAGE_ID}
      META_IG_USER_ID: ${META_IG_USER_ID}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN}
      PAPERCLIP_JAAG5_ISSUE_ID: ${PAPERCLIP_JAAG5_ISSUE_ID}
    volumes:
      - ${N8N_DATA_DIR}:/home/node/.n8n
      - ${CONTENT_DIR:-/opt/jaagsolutions/content}:/opt/jaagsolutions/content
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - web
    depends_on:
      - paperclip
      - n8n

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
