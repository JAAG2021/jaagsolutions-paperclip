# Requiere: deploy/.env (copiar desde .env.production.example)
# Levantar: cd deploy && docker compose --env-file .env up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ─── Paperclip: RETIRADO 2026-09-02 ──────────────────────────────────────────
  # Auditoría del 2026-09-02: ningún workflow activo lo consumía. El único que le
  # hacía POST (`Formspree Lead → Paperclip Issue`, id wGBj1gkmy1JoBfGP) quedó
  # desactivado. Los leads siguen llegando por correo vía Formspree, que es una
  # rama independiente de la Cloudflare Function (ver jaagsolutions-web/functions/api/lead.js).
  # Además su `depends_on` impedía arrancar n8n si Paperclip fallaba el healthcheck.
  # Para restaurarlo: recuperar este bloque del historial de git + el registro DNS
  # `paperclip` en Cloudflare + el vhost en el Caddyfile.

  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    image: jaagsolutions-n8n:1.112.6
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_HOST: n8n.${DOMAIN}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.${DOMAIN}/
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      GENERIC_TIMEZONE: America/Santiago
      NODE_FUNCTION_ALLOW_BUILTIN: "fs,path,https,http"
      NODE_FUNCTION_ALLOW_EXTERNAL: "sharp"
      # En n8n ≥1.x, el Code node corre en task runners (proceso hijo) por defecto.
      # Esos hijos no heredan NODE_PATH del container, así que require('sharp') falla.
      # Lo desactivamos para que el Code node use el proceso principal de n8n.
      N8N_RUNNERS_ENABLED: "false"
      # Refuerzo: NODE_PATH también explícito en compose por si algún proceso lo pierde
      NODE_PATH: "/opt/n8n-modules/node_modules"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Expuestas al workflow (Code / expresiones vía process.env)
      # Las PAPERCLIP_* se retiraron el 2026-09-02 junto con el servicio: se
      # verificó que ni content-generator.json ni telegram-approval.json las
      # referencian (0 coincidencias de "paperclip" en sus parámetros).
      FORMSPREE_WEBHOOK_SECRET: ${FORMSPREE_WEBHOOK_SECRET}
      FORMSPREE_FORM_HASHID: ${FORMSPREE_FORM_HASHID:-}
      # ── Content Pipeline ──────────────────────────────────
      STABILITY_AI_API_KEY: ${STABILITY_AI_API_KEY}
      IDEOGRAM_API_KEY: ${IDEOGRAM_API_KEY}
      GOOGLE_VISION_API_KEY: ${GOOGLE_VISION_API_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN}
      META_PAGE_ID: ${META_PAGE_ID}
      META_IG_USER_ID: ${META_IG_USER_ID}
      LINKEDIN_ACCESS_TOKEN: ${LINKEDIN_ACCESS_TOKEN}
      # URN del autor: urn:li:person:{PERSON_ID} (personal) o urn:li:organization:{ORG_ID} (página de empresa)
      LINKEDIN_AUTHOR_URN: ${LINKEDIN_AUTHOR_URN}
      # URN de la página de empresa que también recibe las publicaciones aprobadas con imagen.
      LINKEDIN_ORGANIZATION_URN: ${LINKEDIN_ORGANIZATION_URN}
      # URL pública de las imágenes (Caddy las sirve bajo /static-content/* en el subdominio n8n)
      CONTENT_PUBLIC_URL: https://n8n.${DOMAIN}/static-content
      # ── Variables de retención (evitar SQLITE_FULL) ────────────────────────────
      EXECUTIONS_DATA_PRUNE: ${EXECUTIONS_DATA_PRUNE}
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE}
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: ${EXECUTIONS_DATA_PRUNE_MAX_COUNT}
      DB_SQLITE_VACUUM_ON_STARTUP: ${DB_SQLITE_VACUUM_ON_STARTUP}
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: ${EXECUTIONS_DATA_SAVE_ON_SUCCESS}
      # ── Variables para compose-image.js (Code node) ────────────────────────────
      DOMAIN: ${DOMAIN}
      CONTENT_DIR: ${CONTENT_DIR}
    volumes:
      - ${N8N_DATA_DIR}:/home/node/.n8n
      - ${CONTENT_DIR:-/opt/jaagsolutions/content}:/opt/jaagsolutions/content
    networks:
      - internal
      - web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      # Sirve imágenes generadas en content.${DOMAIN} (read-only)
      - ${CONTENT_DIR:-/opt/jaagsolutions/content}:/srv/content:ro
    environment:
      DOMAIN: ${DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    networks:
      - web
    depends_on:
      - n8n

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    driver: bridge
  web:
    driver: bridge
